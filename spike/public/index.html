<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>BT spike</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111 }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee } }
    button { font: inherit; padding: 10px 14px; margin: 4px 4px 4px 0 }
    pre { white-space: pre-wrap; word-break: break-all; font-size: 13px }
  </style>
</head>
<body>
  <h1>BT spike</h1>
  <p id="shell">Shell loaded at <span id="loaded"></span> (<span id="source"></span>)</p>
  <button data-check="me">S3: fetch /api/me (manual redirect)</button>
  <button data-check="identity">S2/S5: identity</button>
  <button data-check="ws">S2: open WebSocket</button>
  <button data-check="login">Sign in (/api/login)</button>
  <pre id="log"></pre>
  <script type="module" src="/spike.js"></script>
</body>
</html>
